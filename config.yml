# Register API endpoints (pylon_main serves admin APIs)
register_api: true
# Identity verification (C-1009, #6756). Absent => no identity kind that needs
# settings is admitted. tenant_id must be a tenant GUID (not common/organizations/consumers).
# identity_verifier:
#   session_user:
#     tenant_id: <guid>
#     audience: api://elitea-api-test
#     jwks_uri: https://login.microsoftonline.com/<guid>/discovery/v2.0/keys
#     issuer: https://login.microsoftonline.us/<guid>/v2.0   # optional: national clouds or the local-dev mock issuer
#     insecure_dev_http: false   # local-dev only: allow http for localhost/*.localhost jwks_uri and issuer
#     leeway_s: 60            # 0-300
#     jwks_lifespan_s: 3600
#     algorithms: [RS256]
#     # Which claims carry the tenant and the subject (defaults: Entra tid/oid). A generic
#     # OIDC issuer such as Keycloak has no tenant claim: set tid to null, name the subject
#     # claim, and keep tenant_id as the operator-assigned GUID of that realm (the same value
#     # auth_oidc's subject_tenant uses). Keycloak omits nbf: switch require_nbf off.
#     subject_claims: {tid: tid, oid: oid}
#     require_nbf: true
#     # Which stored token is verified: access_token (default; Entra, aud = this API app) or
#     # id_token (aud is always the client id: for issuers whose access tokens carry no
#     # audience for this platform without extra mappers, e.g. Keycloak).
#     delegation_token: access_token
#   workload:
#     issuer: <iss>
#     jwks_uri: <https uri>
#     audiences: {governed_ops: elitea:governed-ops}
